# Monitoring config template. Copy to config.toml and adjust per host.
# install.sh will auto-copy this to config.toml on first run if missing.
# Path-relative entries are resolved against the directory of THIS file.

# Identifier for this host. Shown in dashboard title and /api/health response.
# Set to your hostname (e.g. "gpu-server-01") so cross-host correlation
# can tell which monitor a record came from.
host_id = "<set-per-host>"

db_path = "monitor.db"
stalls_dir = "stalls"
gdb_path = "/usr/bin/gdb"
sudo_path = "/usr/bin/sudo"

[ollama]
container_name = "ollama"
# Path to your docker-compose.yml (relative or absolute).
compose_file = "../docker-compose.yml"

[api]
host = "0.0.0.0"
port = 3002

[gpu]
# 1 Hz is the fleet standard (STANDARD.md). At <=5s the collector runs ONE
# long-lived `nvidia-smi --loop-ms` instead of spawning a process per sample —
# per-call cost was measured at ~29 ms, which is ~3% of a core at 1 Hz.
poll_interval_sec = 1
heartbeat_sec = 60               # force-write at least every N sec even if no delta

[process]
# Left at 10s on purpose: cpu_percent is a delta over the interval and gets
# noisy at 1 Hz, and /proc reads are cheap enough that nothing is gained.
# Consequence: the 5s rollup tier is skipped for system_metrics — a bucket can
# never be finer than the source it is built from. retention.py detects this
# from poll_interval_sec and skips the tier by itself.
poll_interval_sec = 10
heartbeat_sec = 60               # force-write at least every N sec even if no delta

[stall]
poll_interval_sec = 5
vram_min_mib = 1000
util_max_percent = 5
ollama_serve_cpu_min_percent = 50
# Strict criteria: tighter power threshold + N polls in a row.
strict_power_max_watts = 50
strict_consecutive_polls = 6     # 6 * 5s = 30s continuous
# Loose criteria: relaxed power threshold + sliding window.
loose_power_max_watts = 75
loose_window_polls = 6           # window size = 30s
loose_window_match_fraction = 0.8 # 80% of last 30s must match
cooldown_sec = 120
capture_gdb = true
capture_proc_stacks = true

# GHOST criteria: opposite signature of strict/loose. Ollama accepted the
# request (active) and the model is loaded (vram>min) but the GPU does
# nothing (util<=max) AND ollama serve is NOT cpu-bound (serve_cpu<max).
# Catches the "POST taken, then nothing" failure mode that strict/loose miss.
ghost_serve_cpu_max_percent = 50
ghost_consecutive_polls = 6      # 6 * 5s = 30s of confirmed inactivity

[retention]
# Tiered retention — see STANDARD.md. Sampled series are DOWNSAMPLED (avg AND
# max per bucket), event tables are never downsampled, only deleted very late.
#
# The old `days = 30` key is gone. It belonged to the cron job that never ran
# on any host (multi-line command in /etc/cron.d, which crontab does not
# support), so it never had any effect. retention.py ignores it if still
# present rather than acting on a value nobody validated.
raw_hours = 24                   # keep full resolution this long
tiers = [[5, 7], [60, 360]]      # [bucket seconds, keep days] — coarser downward
events_days = 360                # ollama_requests + stall_events: delete only
stalls_days = 360                # stack dumps on disk
vacuum_min_deleted = 100000      # VACUUM locks the file — only when it pays off

# ---------------------------------------------------------------- stack_check
# Optional. Fehlt dieser Block, gelten die ti-30-Vorgaben aus
# tests/stack_check.py — auf ti-30 ist er deshalb ueberfluessig.
#
# Er existiert wegen fA-439: auf ti11 rissen 8 von 25 Pruefungen, ALLE ACHT
# wegen ti-30-Annahmen im Skript, bei nachweislich korrekter Konfiguration des
# laufenden Containers. Ein Check, der einen gesunden Host als "NICHT
# BETRIEBSBEREIT" meldet, verleitet zum Eingriff in genau die Konfiguration,
# die er schuetzen soll.
#
# Werte, die je Host abweichen duerfen:
#
# [stack_check]
# container = ["ollama", "open-webui", "tei-embed", "tei-reranker"]
# dienste   = ["ollama-gpu-logger", "ollama-log-parser",
#              "ollama-process-logger", "ollama-stall-detector",
#              "ollama-dashboard"]
# modell_klinisch  = "alibayram/medgemma:27b"
# modell_agentisch = "qwen3.6:35b-a3b-q4_K_M"
# ollama_url = "http://127.0.0.1:11434"
# log_max_size = "25m"     # Flotten-Standard, siehe STANDARD.md §1
# log_max_file = "4"
#
# [stack_check.soll_env]
# OLLAMA_CONTEXT_LENGTH   = "131072"
# OLLAMA_NUM_PARALLEL     = "2"
# OLLAMA_MAX_LOADED_MODELS = "2"
# OLLAMA_FLASH_ATTENTION  = "1"   # "1" und "true" gelten als gleichwertig
#
# soll_env wird am LAUFENDEN Container gemessen (`docker exec ... env`), nicht
# aus der Compose-Datei gelesen — die Datei ist die Absicht, der Prozess ist
# der Betrieb. Deshalb ist die Compose-Syntax (Abbildung oder Liste) egal.
#
# Wechselnde Container-Sets (fA-439, ti11-Ops)
# -------------------------------------------
# `container` oben ist die PFLICHT-Liste: was in jedem Betriebsmodus laufen
# muss. Teilt sich ein Host mehrere Sets eine Karte und schaltet zwischen
# ihnen um, kommen die wechselnden Container hierher:
#
# [stack_check.modi]
# diwa  = ["tei-embed", "tei-reranker"]
# voice = ["faster-whisper-api", "f5-tts", "call-agent"]
#
# Geprueft wird je Set der laufende Zustand, nicht ein konfigurierter Modus:
#
#   alle da   -> in Ordnung, dieses Set ist aktiv
#   keiner da -> Hinweis "Set 'voice' laeuft nicht", KEIN Fehler
#   teils da  -> HARTER FEHLER: ein halb laufendes Set ist kein Moduswechsel,
#                sondern ein aktives Set, aus dem etwas weggebrochen ist
#
# Absichtlich gibt es KEINEN Schluessel `modus = "diwa"`. Der muesste beim
# Umschalten mitgepflegt werden und wuerde still veralten — genau die
# Fehlerklasse, die dieses Skript loswerden soll.
