# Log rotation, fleet standard — 25 MB x 4 files = 100 MB cap per container.
# See monitoring/STANDARD.md. Also set daemon-wide in /etc/docker/daemon.json;
# repeated here so the intent is visible in git and travels with the stack.
#
# Why it matters: json-file has NO rotation by default. On ti-30 the ollama log
# had grown to 919 MB (~61 MB/day, driven by OLLAMA_DEBUG=1 plus a 1 Hz
# /api/ps poller), on ti11 to 868 MB. Worse, an unclean shutdown on 2026-07-05
# left a block of NUL bytes in both files, and `docker logs` stops dead at it —
# 99% of ti-30's log was unreachable while the file kept growing. A rotated log
# ages that damage out instead of carrying it forever.
#
# Log-Rotation, Flotten-Standard — 25 MB x 4 Dateien = 100 MB Deckel je Container.
# Greift erst beim NEUERZEUGEN eines Containers, nicht beim Neustart.
x-logging: &logdefaults
  driver: json-file
  options:
    max-size: "25m"
    max-file: "4"

services:
  ollama:
    logging: *logdefaults
    # Pinned image version (not :latest) for controlled updates.
    # Image-Version gepinnt (nicht :latest), fuer kontrollierte Updates.
    # bis 11-Mai-206 Abstimmung s. Slack 9-Mai 10:09
    image: ollama/ollama:0.19.0

    container_name: ollama
    restart: unless-stopped
    networks: [openllm-net]

    # Bind to host IP(s) from .env. Use BIND_IP=0.0.0.0 for all interfaces.
    # Bindet an Host-IP(s) aus .env. BIND_IP=0.0.0.0 = alle Interfaces.
    ports:
      - "${BIND_IP}:11434:11434"
      - "${BIND_IP_WLAN}:11434:11434"

    # External DNS for reliable resolution of registry.ollama.ai.
    # Externe DNS fuer zuverlaessige Aufloesung von registry.ollama.ai.
    dns:
      - 1.1.1.1
      - 8.8.8.8

    # Persistence path is composable via DATA_ROOT in .env.
    # Persistenzpfad ueber DATA_ROOT in .env konfigurierbar.
    volumes:
      - ${DATA_ROOT}/ollama:/root/.ollama

    environment:
      # ── Scheduling & Queuing ──
      # 2 parallel slots for concurrent request batching; MoE benefits from parallelism.
      # 2 parallele Slots fuer Request-Batching; MoE profitiert von Parallelitaet.
      OLLAMA_NUM_PARALLEL: "2"
      OLLAMA_MAX_LOADED_MODELS: "2"
      # Queue depth: requests wait instead of forcing model unload (default 512).
      # Warteschlange: Requests warten statt Modelle zu entladen (Default 512).
      OLLAMA_MAX_QUEUE: "16"
      # Unload idle models after 10 min (default 5m); buffer for RAG workflows.
      # Idle-Modelle nach 10 Min entladen (Default 5m); Puffer fuer RAG-Workflows.
      OLLAMA_KEEP_ALIVE: "10m"

      # ── Logging ──
      # Debug mode: logs model name, token counts, timings per request.
      # Debug-Modus: loggt Modellname, Token-Counts und Timings pro Request.
      OLLAMA_DEBUG: "1"

      # ── Context & memory ──
      # 128k context matches DIWA split-pool spec (giants >128k routed to GX-10).
      # 128k Kontext = DIWA-Split-Pool-Spec (Giganten >128k gehen auf GX-10).
      OLLAMA_CONTEXT_LENGTH: "131072"
      # Flash Attention reduces KV-cache VRAM by ~30-50%.
      # Flash Attention reduziert KV-Cache VRAM um ~30-50%.
      OLLAMA_FLASH_ATTENTION: "1"
      # 2 GiB reserve = conservative, practical.
      # 2 GiB Reserve = konservativ, praxistauglich.
      OLLAMA_GPU_OVERHEAD: "2147483648"

      # ── GPU ──
      # All visible GPUs; Ollama auto-distributes layers if a model exceeds one card.
      # Alle sichtbaren GPUs; Ollama verteilt Layers automatisch wenn Modell zu gross fuer eine.
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"

    runtime: nvidia

    healthcheck:
      test: ["CMD", "ollama", "ps"]
      interval: 30s
      timeout: 5s
      retries: 5

  tei-embed:
    logging: *logdefaults
    # CPU-only Text-Embeddings-Inference (bge-m3) as failover for the GX-10 :8001 endpoint.
    # Same host port 8001 as GX-10 for drop-in compatibility — Coordinator registers TI-30 as backup rank.
    # CPU-only bge-m3-Embedding als Backup fuer GX-10 :8001. Gleicher Host-Port fuer Drop-in-Kompatibilitaet.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    container_name: tei-embed
    restart: unless-stopped
    networks: [openllm-net]

    ports:
      - "${BIND_IP}:8001:80"

    volumes:
      - ${DATA_ROOT}/tei-embed:/data

    environment:
      HUGGINGFACE_HUB_CACHE: "/data"
      HF_HOME: "/data"

    command:
      - --model-id=BAAI/bge-m3
      - --max-batch-tokens=8192
      - --max-client-batch-size=64
      - --auto-truncate

    # CPU/RAM caps: leave headroom for ollama (2 cores active) + system.
    # 10 GB memory (2 GB weights + warmup peak, TEI reports ~5 GB steady after warmup).
    # CPU/RAM-Caps: Platz fuer ollama (aktuell 2 Cores) + Rest-System.
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 10G

  tei-rerank:
    logging: *logdefaults
    # CPU-only reranker (bge-reranker-v2-m3). Internal-only — the rerank-adapter service in front of this
    # exposes the GX-10-compatible /v1/rerank shape on host port 8082. TEI raw_scores per-request.
    # CPU-only Reranker — nur intern erreichbar; der rerank-adapter davor spricht das GX-10-Format.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    container_name: tei-rerank
    restart: unless-stopped
    networks: [openllm-net]

    # No host port — reached via rerank-adapter over openllm-net.
    # Kein Host-Port — Zugriff nur ueber rerank-adapter im openllm-net.
    expose:
      - "80"

    volumes:
      - ${DATA_ROOT}/tei-rerank:/data

    environment:
      HUGGINGFACE_HUB_CACHE: "/data"
      HF_HOME: "/data"

    command:
      - --model-id=BAAI/bge-reranker-v2-m3
      - --max-batch-tokens=8192
      - --max-client-batch-size=32
      - --auto-truncate

    deploy:
      resources:
        limits:
          cpus: "3"
          memory: 10G

  rerank-adapter:
    logging: *logdefaults
    # Thin Python-stdlib HTTP-Adapter: OpenAI /v1/rerank (documents/relevance_score) -> TEI /rerank
    # (texts/score, raw_scores:true). Makes TI-30 drop-in compatible with GX-10 for the Coordinator.
    # Duenner Adapter, damit Coordinator TI-30 wie GX-10 auf /v1/rerank ansprechen kann.
    image: python:3.12-slim
    container_name: rerank-adapter
    restart: unless-stopped
    networks: [openllm-net]
    depends_on:
      - tei-rerank

    ports:
      - "${BIND_IP}:8082:80"

    volumes:
      - ./rerank-adapter:/app:ro

    environment:
      TEI_URL: "http://tei-rerank/rerank"
      TEI_HEALTH: "http://tei-rerank/health"
      MODEL_NAME: "bge-reranker-v2-m3"
      PORT: "80"

    command: ["python3", "/app/adapter.py"]

    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M

  openwebui:
    logging: *logdefaults
    # Pinned image version (not :latest) for controlled updates.
    # Image-Version gepinnt (nicht :latest), fuer kontrollierte Updates.
    image: ghcr.io/open-webui/open-webui:v0.6.43

    container_name: openwebui
    restart: unless-stopped
    networks: [openllm-net]
    depends_on:
      - ollama

    # External port from .env (default 3000).
    # Externer Port aus .env (Default 3000).
    ports:
      - "${BIND_IP}:${OPENWEBUI_PORT}:8080"

    # Persistence path is composable via DATA_ROOT in .env.
    # Persistenzpfad ueber DATA_ROOT in .env konfigurierbar.
    volumes:
      - ${DATA_ROOT}/openwebui:/app/backend/data

    environment:
      # WebUI talks to ollama internally over the docker network.
      # WebUI spricht intern den ollama-Service ueber Docker-Netz an.
      OLLAMA_BASE_URL: "http://ollama:11434"

networks:
  openllm-net:
    name: openllm-net
